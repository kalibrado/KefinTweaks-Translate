name: Tag v0.1.0 (one-time)

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  create-release-tag:
    if: github.repository == 'kalibrado/KefinTweaks-Translate' && github.event.head_commit.message == 'chore(release): publish v0.1.0 tag'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout and fetch refs
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify tested source
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e 59e56c0cade2053d02acd9fbebba654ab85108aa^{commit}
          test "$(git rev-parse 59e56c0cade2053d02acd9fbebba654ab85108aa:package.json | head -c 0; git show 59e56c0cade2053d02acd9fbebba654ab85108aa:package.json | grep -c '"version": "0.1.0"')" -ge 1
          npm run check
      - name: Publish annotated tag on validated commit
        shell: bash
        run: |
          set -euo pipefail
          if git show-ref --verify --quiet refs/tags/v0.1.0; then
            echo "Refusing to overwrite existing tag" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a v0.1.0 59e56c0cade2053d02acd9fbebba654ab85108aa -m "KefinTweaks-Translate v0.1.0"
          git push origin refs/tags/v0.1.0
