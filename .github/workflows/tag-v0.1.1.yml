name: Tag v0.1.1 (one-time)
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  create-release-tag:
    if: >-
      github.repository == 'kalibrado/KefinTweaks-Translate' &&
      github.event.head_commit.message == 'chore(release): publish v0.1.1 tag'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify release target
        shell: bash
        run: |
          set -euo pipefail
          target='645c3d6bebfaf45003331b10ea4832647c253687'
          git cat-file -e "${target}^{commit}"
          git show "${target}:package.json" | grep -q '"version": "0.1.1"'
          npm run check
      - name: Tag tested commit
        shell: bash
        run: |
          set -euo pipefail
          if git show-ref --verify --quiet refs/tags/v0.1.1; then
            echo "Refusing to overwrite existing release tag" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a v0.1.1 645c3d6bebfaf45003331b10ea4832647c253687 -m "KefinTweaks-Translate v0.1.1"
          git push origin refs/tags/v0.1.1
